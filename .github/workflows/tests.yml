name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # setup-miniconda activates the env through the login profile, so every
    # step needs a login shell to see it
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      - name: Create the mineral env
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: mineral
          conda-remove-defaults: "true"

      - name: Install cnmineral
        run: pip install -e .

      - name: Run the unit tests
        run: |
          set -o pipefail
          pytest tests/ -rfEs | tee pytest.log

      - name: Summarize the test results
        if: always()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -A 1000 "short test summary info" pytest.log >> "$GITHUB_STEP_SUMMARY" \
            || tail -n 1 pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
