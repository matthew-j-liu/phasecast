# Base CrabNet model v0 — ModeHead-only training on the smoke MAGEMin H5.
#
# Sole config for scripts/03_train_base.py. Every knob lives here so the CLI
# is just `--config CONFIG.yaml`. Override by editing this file or pointing
# the script at a different YAML.

# Data
data:
  h5_path: data/train_magemin.h5
  val_frac: 0.15
  stratify_by: qap_name
  num_workers: 0

# Model (forwarded to BaseModel constructor; n_minerals auto-inferred from H5)
model:
  d_model: 256
  N: 2
  heads: 8
  dropout: 0.1
  elem_prop: mat2vec

# Training loop
training:
  batch_size: 256
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 100
  cosine_eta_min: 1.0e-6
  patience: 15
  min_delta: 5.0e-6
  seed: 42

# Loss (mode_loss only in v0)
loss:
  lambda_sum: 0.01

# Output
output:
  checkpoint_dir: checkpoints/base_v0
  metrics_log: checkpoints/base_v0/metrics.jsonl
  progress_bar: true
