# v1 HPO sweep config. Single-stage TPE over architecture + loss + GMM dims.
# Search space lives in src/cnmineral/models/objective.py:suggest_hyperparams.
#
# Storage convention: JournalStorage (filesystem), resumable via load_if_exists.

# v1_hpo_10ox: search after dropping h2o_tot from inputs (H2O target-leak fix).
study_name: v1_hpo_10ox
storage_path: data/optuna/v1_hpo_10ox.journal
sampler_seed: 42
n_trials: 50
n_startup_trials: 10           # TPE random-warmup trials
pruner_warmup_folds: 1         # MedianPruner doesn't prune before fold 1 finishes

data:
  parquet_path: data/train_fc_v1.parquet
  liq_threshold: 0.10
  splits_path: data/splits_v1.json
  val_frac: 0.16
  test_frac: 0.20
  min_bulks_per_class: 25
  num_workers: 0
  limit_bulks: null            # null = full corpus; integer = subsample for smoke

cv:
  k_folds: 3
  cv_epochs: 30
  seed: 42
