# BaseModelV1 training config -- the v1 model.
#
# model/training/loss values below are the HPO winner (study v1_hpo_10ox,
# trial #32). `scripts/05_train_ensemble.py --hp-source <summary.json>` will
# still override these from an Optuna summary, but with no --hp-source this
# file alone reproduces the v1 K=5 ensemble. The HP search space itself lives
# in `src/cnmineral/models/objective.py:suggest_hyperparams`.
#
# Consumed by 03_train_base.py (single train), 05_train_ensemble.py, and
# 06_eval_ensemble.py. `--limit-bulks` on the CLI subsamples bulks for smoke
# runs.

model_version: v1

data:
  parquet_path: data/train_fc_v1.parquet
  liq_threshold: 0.10
  splits_path: data/splits_v1.json
  val_frac: 0.16
  test_frac: 0.20
  min_bulks_per_class: 25
  stratify_by: qap_name
  num_workers: 0

# Architecture. d_model/N/heads/dropout/K_gmm are HPO-tuned (trial #32).
# elem_prop, alpha_floor, and the head hidden sizes are fixed (not searched).
model:
  d_model: 512
  N: 4
  heads: 16
  dropout: 0.1291674223626035
  elem_prop: mat2vec
  K_gmm: 3
  alpha_floor: 1.0e-3
  mode_hidden: [256, 128]
  cond_hidden: [256, 128]

# Training loop. lr/weight_decay/batch_size are HPO-tuned (trial #32).
# epochs/cosine_eta_min/patience/min_delta/seed/grad_clip are fixed.
training:
  batch_size: 512
  lr: 1.2544667090185296e-4
  weight_decay: 1.0360239470725389e-5
  epochs: 100
  cosine_eta_min: 1.0e-6
  patience: 15
  min_delta: 5.0e-6
  grad_clip: 1.0
  seed: 42

# Joint NLL loss: 0.5*NLL_dirichlet + 0.5*lambda_cond*NLL_gmm.
# lambda_cond and eps_smooth are HPO-tuned (trial #32).
loss:
  lambda_cond: 3.4445329598364895
  eps_smooth: 1.0123622038071508e-4

output:
  checkpoint_dir: checkpoints/base_v1
  metrics_log: checkpoints/base_v1/metrics.jsonl
  progress_bar: true
