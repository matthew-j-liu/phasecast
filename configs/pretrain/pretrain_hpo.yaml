# Encoder HPO for the per-element standardized log-space objective.
#
# Strategy A (issue #7): re-tune only the optimization HPs at the locked
# 256/4/8 architecture (the original sweep's winner), so the objective is the
# only variable vs the linear-MSE canonical encoder.  Architecture dims are
# pinned in `base`, NOT searched.  lr upper bound is widened to 1e-2 because
# the standardized-log loss is O(1) and may want a larger lr than linear MSE.
#
# Storage: JournalStorage (filesystem), resumable via load_if_exists.

study_name: v3_pretrain_hpo_logmse_std
storage_path: data/optuna/journals/v3_pretrain_hpo_logmse_std.journal
output_dir: runs/pretrain_hpo
sampler_seed: 42
n_trials: 30                   # ~4h/sweep at the measured ~30s mean epoch
n_startup_trials: 10
pruner_warmup_steps: 8
hpo_run_epochs: 20

# Held constant across all trials and the post-sweep production run.
base:
  seed: 0

  # architecture pinned to the original-sweep winner (not searched)
  d_model: 256
  n_layers: 4
  n_heads: 8

  frac_resolution: 5000
  num_workers: 0
  test_split: 0.20
  val_split: 0.20
  epochs: 20

  # same corpus + filters as the canonical encoder, so the gate/probe
  # reconstruct identical splits (apples-to-apples)
  data_kwargs:
    csv_path: data/bulks/gard2019.csv
    rock_group: igneous
    drop_zero_as_nan: true
    require_all_majors: true
    include_cr2o3: false

  checkpoint_dir: checkpoints/pretrain_v3_logmse_std_seed0
  checkpoint_best_filename: epoch_best.pt
  checkpoint_last_filename: epoch_last.pt

# Optimization HPs only (the original sweep's non-architecture dims).
search_space:
  lr:           {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  mask_prob:    {type: float, low: 0.15,   high: 0.40}
  weight_decay: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  dropout:      {type: float, low: 0.0,    high: 0.2}
  batch_size:   {type: categorical, choices: [32, 64, 128, 256]}
