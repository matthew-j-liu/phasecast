# Encoder HPO for the plain (unstandardized) log-space objective.
#
# Strategy A (issue #7): identical to pretrain_hpo_logmse_std.yaml except the
# objective skips per-element standardization -- isolates what standardization
# buys the shared encoder.  Optimization HPs only, locked 256/4/8 architecture.
#
# Storage: JournalStorage (filesystem), resumable via load_if_exists.

study_name: v3_pretrain_hpo_logmse_plain
storage_path: data/optuna/journals/v3_pretrain_hpo_logmse_plain.journal
output_dir: results/pretrain_hpo
sampler_seed: 42
n_trials: 30                   # ~4h/sweep at the measured ~30s mean epoch
n_startup_trials: 10
pruner_warmup_steps: 8
hpo_run_epochs: 20

base:
  seed: 0
  loss:
    type: log_mse
    standardize: false

  d_model: 256
  n_layers: 4
  n_heads: 8

  frac_resolution: 5000
  num_workers: 0
  test_split: 0.20
  val_split: 0.20
  epochs: 20

  data_kwargs:
    csv_path: data/bulks/gard2019.csv
    rock_group: igneous
    drop_zero_as_nan: true
    require_all_majors: true
    include_cr2o3: false

  checkpoint_dir: checkpoints/pretrain_v3_logmse_plain_seed0
  checkpoint_best_filename: epoch_best.pt
  checkpoint_last_filename: epoch_last.pt

search_space:
  lr:           {type: float, low: 1.0e-5, high: 1.0e-2, log: true}
  mask_prob:    {type: float, low: 0.15,   high: 0.40}
  weight_decay: {type: float, low: 1.0e-4, high: 1.0e-1, log: true}
  dropout:      {type: float, low: 0.0,    high: 0.2}
  batch_size:   {type: categorical, choices: [32, 64, 128, 256]}
