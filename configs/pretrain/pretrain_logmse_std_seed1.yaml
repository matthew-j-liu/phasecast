# Seed-1 confirmation run for the standardized log-space SSL objective.
#
# Single run (no --hpo) at the seed-0 HPO winner's optimization HPs, to
# confirm the trace-imputation gain holds across seeds before the encoder
# is declared canonical.  HPs copied from the stamped config of
# checkpoints/pretrain_v3_logmse_std_seed0/epoch_best.pt; only `seed` and
# `checkpoint_dir` differ.

seed: 1

loss:
  type: log_mse
  standardize: true

lr: 8.17949947521167e-05
mask_prob: 0.28118910790805945
weight_decay: 0.001976218934028009
dropout: 0.058245828039608386
batch_size: 32

d_model: 256
n_layers: 4
n_heads: 8

epochs: 20
test_split: 0.20
val_split: 0.20
num_workers: 0
frac_resolution: 5000

data_kwargs:
  csv_path: data/bulks/gard2019.csv
  rock_group: igneous
  drop_zero_as_nan: true
  require_all_majors: true
  include_cr2o3: false

checkpoint_dir: checkpoints/pretrain_v3_logmse_std_seed1
checkpoint_best_filename: epoch_best.pt
checkpoint_last_filename: epoch_last.pt
