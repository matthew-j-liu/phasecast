# Single-run SSL pretrain config (production-shape).
#
# After an HPO sweep picks winners, copy the best params from the
# study summary JSON into this file and run a longer training run:
#     python scripts/pretrain.py --config configs/pretrain/pretrain_production.yaml

seed: 0
epochs: 10
batch_size: 64
lr: 3.0e-4
mask_prob: 0.25
weight_decay: 0.01
dropout: 0.0
d_model: 512
n_layers: 4
n_heads: 16
frac_resolution: 5000
num_workers: 0

# train/val/test split: 80/20 to reserve test, then 80/20 on the
# trainval pool to get train/val. defaults yield the canonical 64/16/20.
test_frac: 0.20
val_frac: 0.20

data_source: real
# data_kwargs:     # forwarded to BulkChemistryDataset(**data_kwargs) once it lands
#   parquet_path: data/complete.csv

checkpoint_dir: checkpoints/pretrain_v3
