# Seed-0 canonical SSL encoder (ADR 007).
#
# Single production run at the seed-0 HPO winner's optimization HPs, verified
# against the stamped config of
# checkpoints/pretrain_v3_logmse_std_seed0/epoch_best.pt.  The objective is
# unconditional (per-element standardized log-space masked MSE), so there is
# no loss: block.  Set seed: 1 to reproduce the cross-seed confirmation run --
# update checkpoint_dir to match the seed.

seed: 0

batch_size: 32
lr: 8.17949947521167e-05
mask_prob: 0.28118910790805945
weight_decay: 0.001976218934028009
dropout: 0.058245828039608386
d_model: 256
n_layers: 4
n_heads: 8

epochs: 20
test_split: 0.20
val_split: 0.20

num_workers: 0
frac_resolution: 5000

data_kwargs:
  csv_path: data/bulks/gard2019.csv
  rock_group: igneous
  drop_zero_as_nan: true
  require_all_majors: true
  include_cr2o3: false

checkpoint_dir: checkpoints/pretrain_v3_logmse_std_seed0
checkpoint_best_filename: epoch_best.pt
checkpoint_last_filename: epoch_last.pt
