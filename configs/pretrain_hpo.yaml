# SSL pretrain HPO sweep config.  Search space lives in
# scripts/pretrain.py::suggest_hyperparams.
#
# Storage: JournalStorage (filesystem); resumable via load_if_exists.

study_name: v3_pretrain_hpo_smoke
storage_path: data/optuna/v3_pretrain_hpo_smoke.journal
sampler_seed: 42
n_trials: 20
n_startup_trials: 5            # TPE random-warmup trials
pruner_warmup_steps: 1         # MedianPruner skips epoch 0
hpo_run_epochs: 3              # SSL pretrain is too expensive for CV per trial

# Full run_pretraining config dict.  Trial overrides from suggest_hyperparams
# land on top; `hpo_run_epochs` above replaces `epochs`.
base:
  seed: 0
  batch_size: 64
  lr: 3.0e-4
  mask_prob: 0.25
  weight_decay: 0.01
  dropout: 0.0
  d_model: 512
  n_layers: 4
  n_heads: 16
  frac_resolution: 5000
  num_workers: 0
  data_source: real
