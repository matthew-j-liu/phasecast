# Log-space imputation head on the frozen canonical SSL encoder.
# Dataset + splits are reconstructed from the encoder checkpoint's config;
# only the head trains here.  HPs are the Optuna sweep's best (objective:
# median trace log-R2 on the held-out val split, encoder frozen).

encoder_checkpoint: checkpoints/pretrain_v3_logmse_std_seed0/epoch_best.pt

# head architecture
hidden: 1024          # one GELU MLP layer (null -> linear read-out)
dropout: 0.0658
standardize: true     # per-element log10(frac) center/scale in the loss

# optimization
epochs: 80            # ceiling; early stopping ends it sooner
early_stop_patience: 8
batch_size: 256
lr: 1.398e-4
weight_decay: 2.838e-7
mask_prob: 0.217
val_split: 0.20
seed: 0
num_workers: 0

head_checkpoint_dir: checkpoints/imputation_head_logmse_std_seed0
head_checkpoint_filename: head_best.pt
