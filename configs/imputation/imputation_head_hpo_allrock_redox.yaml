# Optuna HPO for the log-space imputation head on the frozen all-rock +
# redox-token encoder -- the yardstick re-tune of the acceptance battery
# (the read-out head re-tunes per encoder so the comparison measures the
# latent, not a stale head).  Same sweep design as imputation_head_hpo.yaml;
# storage and outputs template on the encoder tag, so nothing collides.

encoder_checkpoint: checkpoints/pretrain_allrock_redox_seed0/epoch_best.pt

study_name: imputation_head_hpo
storage_path: data/optuna/journals/imputation_head_hpo_{encoder_tag}.journal
output_dir: runs/imputation_hpo  # summary lands at output_dir/<encoder_tag>/summary.json
sampler_seed: 42
n_trials: 40
n_startup_trials: 8

score_batch_size: 512

base:
  batch_size: 256
  val_split: 0.20
  seed: 0
  epochs: 80              # ceiling; early stopping ends most trials sooner
  early_stop_patience: 8

search_space:
  hidden:        {type: categorical, choices: [128, 256, 512, 1024]}
  lr:            {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  weight_decay:  {type: float, low: 1.0e-7, high: 1.0e-2, log: true}
  dropout:       {type: float, low: 0.0, high: 0.4}
  mask_prob:     {type: float, low: 0.10, high: 0.40}

# Untuned reference (the 2026-06-16 design ablation's fixed point), scored on
# the same val split so the journal can report tuned-vs-untuned on this encoder.
baseline:
  hidden: 256
  lr: 1.0e-3
  weight_decay: 0.0
  dropout: 0.0
  epochs: 20
  early_stop_patience: null
