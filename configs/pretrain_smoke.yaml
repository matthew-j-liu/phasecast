# Smoke-test config: synthetic data, tiny model, 1 epoch.
# Verifies the script + dataset wiring without touching the real corpus.
#     python scripts/pretrain.py --config configs/pretrain_smoke.yaml

seed: 0
epochs: 1
batch_size: 4
lr: 3.0e-4
mask_prob: 0.25
weight_decay: 0.01
dropout: 0.0
d_model: 32
n_layers: 2
n_heads: 4
frac_resolution: 200
num_workers: 0

# at n=16, default 0.20/0.20 yields 10 train / 3 val / 3 test -- tight but
# enough to exercise the split + val pass in smoke.
test_frac: 0.20
val_frac: 0.20

data_source: synthetic
synthetic_n: 16

checkpoint_dir: null
