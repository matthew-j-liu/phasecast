# BaseModelV1 supervised fine-tune on V2 inputs (22-token vocab: 9 majors + 13 traces).
#
# Consumed by `scripts/03_train_base.py` (single-seed) via the v2 dispatch
# branch (run_v2). Same architecture as v1 (the model class is unchanged);
# the deltas vs base_v1.yaml are:
#   - data.dataset_class: TrainFCv2Dataset (joins complete.csv for traces)
#   - model.pretrain_init: load SSL-pretrained encoder weights
#   - training.encoder_lr_scale: param-group lr ratio for the encoder vs heads
#
# Ablation cell control:
#   - majors_only: false => full v2 (cell d), majors+traces with pretrain
#   - majors_only: true  => cell c, majors-only with pretrained encoder
#   - pretrain_init: null + majors_only: false => cell b (traces, random init)
#   - cell a is the existing v1 ensemble (no v2 retrain needed)

model_version: v2

data:
  parquet_path: data/train_fc_v1.parquet
  complete_csv_path: data/complete.csv
  liq_threshold: 0.10
  splits_path: data/splits_v1.json
  val_frac: 0.16
  test_frac: 0.20
  min_bulks_per_class: 25
  stratify_by: qap_name
  num_workers: 0
  majors_only: false       # ablation flag (see header)

# Architecture: HPO-tuned v1 winning config (trial #32). Unchanged.
model:
  d_model: 512
  N: 4
  heads: 16
  dropout: 0.1291674223626035
  elem_prop: mat2vec
  K_gmm: 3
  alpha_floor: 1.0e-3
  mode_hidden: [256, 128]
  cond_hidden: [256, 128]
  # SSL pretrain checkpoint (set to null for random init = ablation cells a/b).
  pretrain_init: checkpoints/pretrain_v2/encoder_best.pt

# Training: same v1 HPO winner, but with separate encoder/head lrs.
training:
  batch_size: 512
  lr: 1.2544667090185296e-4         # head lr
  encoder_lr_scale: 0.1             # encoder lr = encoder_lr_scale * lr
  weight_decay: 1.0360239470725389e-5
  epochs: 100
  cosine_eta_min: 1.0e-6
  patience: 15
  min_delta: 5.0e-6
  grad_clip: 1.0
  seed: 42

loss:
  lambda_cond: 3.4445329598364895
  eps_smooth: 1.0123622038071508e-4

output:
  checkpoint_dir: checkpoints/base_v2
  metrics_log: checkpoints/base_v2/metrics.jsonl
  progress_bar: true
