# Joint single-stage HPO for the three heads (ADR 006): shared training
# environment + ModeHead architecture, ranked on the raw assemblage NLL at
# ModeHead's own best epoch. Per-head best checkpointing in the trainer means
# trials never arbitrate stopping; comp/cond bests ride along as user attrs.
# comp/cond architecture is objective-invisible here and gets its own
# conditional mini-sweeps (configs written after this sweep locks the
# environment). Resumable via JournalStorage; n_trials is a ceiling, stop
# anytime.
#
# `base:` carries the locked knobs; `search_space:` the swept ones --
# disjoint, same convention as configs/imputation/imputation_head_hpo.yaml.
# `baseline:` is enqueued as trial 0 (the untuned reference: current
# joint_heads.yaml values, weight_decay repointed to the log-range floor).

study_name: joint_heads_hpo
storage_path: data/optuna/journals/joint_heads_hpo.journal
output_dir: results/heads_hpo

objective: mode
tie_band: 0.03        # nats; val-roster wobble scale -- differences under this are ties
sampler_seed: 42
n_trials: 42
n_startup_trials: 20

base:
  encoder_checkpoint: checkpoints/pretrain_v3_logmse_std_seed0/epoch_best.pt
  corpus_dir: data/corpus/train
  valtest_corpus_dir: data/corpus/valtest
  rungs: [50, 30]
  comp_eps: 1.0e-4
  comp_hidden: null
  comp_layers: 1
  cond_hidden: null
  cond_layers: 1
  alpha_eps: 1.0e-6
  cond_n_components: 3
  cond_sigma_eps: 1.0e-3
  lambda_comp: 1.0
  lambda_cond: 0.01
  epochs: 60
  early_stop_patience: 10
  batch_size: 1024
  seed: 0

search_space:
  lr:               {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  weight_decay:     {type: float, low: 1.0e-7, high: 1.0e-2, log: true}
  magnitude_weight: {type: float, low: 0.1, high: 10.0, log: true}
  lambda_balance:   {type: float, low: 1.0e-3, high: 1.0e+4, log: true}
  dropout:          {type: float, low: 0.0, high: 0.4}
  mode_hidden:      {type: categorical, choices: [64, 128, 256, 512]}
  mode_layers:      {type: int, low: 1, high: 3}

baseline:
  lr: 1.0e-3
  weight_decay: 1.0e-7
  magnitude_weight: 1.0
  lambda_balance: 1.0
  dropout: 0.0
  mode_hidden: 128
  mode_layers: 1
