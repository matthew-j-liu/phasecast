# Probe HPO sweep config.
#
# Runs Optuna over the MLP probe hyperparameters against a *fixed*
# encoder checkpoint.  The LR baseline is reported alongside but not
# swept -- LR is a fixed-protocol linear-readout (per standard SSL
# eval: SimCLR / MoCo / CLIP).
#
# `base:` carries every locked probe knob.  `search_space:` declares
# the optimized hyperparameters.  Disjoint, same convention as
# `configs/pretrain/pretrain_hpo.yaml`.  The encoder checkpoint and the
# pretrain config (for reproducing the train/test split) are passed
# at the CLI, not in this file.
#
# Storage: JournalStorage (filesystem); resumable via load_if_exists.
# `storage_path` is a TEMPLATE -- the CLI substitutes the encoder tag
# so multiple encoders can sweep into the same directory without
# colliding.

study_name: probe_hpo_qap
storage_path: data/optuna/journals/probe_hpo_{encoder_tag}.journal
output_dir: results/probe_hpo # summary JSON lands at output_dir/<encoder_tag>/summary.json
sampler_seed: 42
n_trials: 30
n_startup_trials: 6            # TPE random-warmup trials
pruner_warmup_steps: 0         # MLP probe runs are short; no warmup needed

# Probe target.  qap_name is the primary metric per CLAUDE.md;
# supergroup is reported as auxiliary but not the HPO objective.
probe_target: qap_name

# Locked probe knobs: same across all trials.
base:
  probe_epochs: 50
  batch_size: 256
  val_split: 0.1
  early_stop_patience: 5
  seed: 0

# Trial-sampled probe knobs.  Each entry becomes a `trial.suggest_*`
# call inside the HPO objective.
search_space:
  hidden_dim:           {type: categorical, choices: [256, 512, 1024]}
  dropout:              {type: float, low: 0.0,   high: 0.5}
  lr:                   {type: float, low: 1.0e-4, high: 1.0e-2, log: true}
  weight_decay:         {type: float, low: 1.0e-6, high: 1.0e-2, log: true}
  n_hidden_layers:      {type: categorical, choices: [1, 2]}
  label_smoothing:      {type: float, low: 0.0,   high: 0.15}
  l2_normalize_inputs:  {type: categorical, choices: [false, true]}
  use_cosine_schedule:  {type: categorical, choices: [false, true]}
