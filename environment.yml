name: alignn_fix
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - xgboost
  - optuna
  - matplotlib
  - h5py
  - pyarrow
  - pyyaml
  - tqdm
  - pytorch
  - pymatgen
  - jupyterlab
  - pytest
  - pip
  - pip:
      - pyrolite
      # PetThermoTools is pip-installed editable from ~/git_clones/PetThermoTools.
      # juliacall + juliapkg are required at runtime by ptt.install_MAGEMinCalc()
      # which provisions ~/.petthermotools_julia_env (isolated from scripts/julia/).
      - juliacall
      - juliapkg
      - -e ../PetThermoTools
