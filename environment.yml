name: mineral
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26
  - pandas=2.2
  - scipy=1.15
  - scikit-learn=1.7
  - xgboost=3.2
  - optuna=4.8
  - matplotlib=3.10
  - h5py=3.15
  - pyarrow=24.0
  - pyyaml
  - tqdm
  - pytorch=2.10
  - pymatgen=2024.5
  - pyrolite=0.3.6  # 0.3.7+ needs python 3.11
  - jupyterlab
  - pytest
  - pip
  # Label generation (README stage 3) additionally needs Julia with MAGEMin;
  # magemin/Project.toml pins that environment.
