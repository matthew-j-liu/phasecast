[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cnmineral"
version = "0.0.1"
description = "phasecast: probabilistic mineralogy from whole-rock geochemistry"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "h5py",
    "pyarrow",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# repo root on sys.path so tests can import repo-level helpers that are
# not installed with the package.
pythonpath = ["."]
testpaths = ["tests"]
