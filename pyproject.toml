[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cnmineral"
version = "0.0.1"
description = "CrabNet-Mineral v2: bulk geochemistry to mineral assemblage via MAGEMin x mineralML fusion"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "h5py",
    "pyarrow",
    "pyyaml",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# explorations/ is not installed; put the repo root on sys.path so mirrored
# tests can import an exploration's code as a tripwire on src/ changes.
pythonpath = ["."]
testpaths = ["tests"]
