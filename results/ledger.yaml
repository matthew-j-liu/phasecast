# Model-version ledger: one entry per shipped version, append-only.
# `date` is when the version shipped (journal entry). Headline NLLs are
# RAW nats (lower = better), pulled from
# runs/<head>_head/<tag>/metrics.json. results/trajectory.png regenerates
# from this file alone.
#
# Every entry is stamped with the `instrument` that measured it (defined
# under `instruments:`). Entries are never re-measured on a later
# instrument: when the valtest rows change (draw count, proposal, labels),
# a new instrument is defined here and starts its own trajectory segment.
# Numbers are comparable only within one instrument; cross-instrument
# model comparison happens on the real-rock benchmark, not in this file.
instruments:
  valtest128-broad:
    roster: committed val slice of the sealed valtest roster
      (src/cnmineral/data/valtest_split.csv; 221 bulks, 218 with corpus rows)
    draws_per_bulk: 128
    proposal: broad uniform LHS over per-class (P, H2O) boxes
      (condition_proposal.draw_conditions)
    noise_floor: 0.024
    tie_band_nats: 0.03
  valtest128-traced@2000:
    roster: committed val slice of the grown valtest roster
      (src/cnmineral/data/valtest_split.csv; 887 val bulks, 871 with corpus rows)
    draws_per_bulk: 128
    proposal: trace-conditional per-bulk (P, H2O) sampling
      (condition_proposal.bulk_proposal)
    # 5-6 valtest bulks each, permanently (class pools exhausted at the 2000
    # extension): per-class numbers for these are anecdote -- caveat wherever
    # they appear, never uncaveated in ledger or paper tables
    thin_classes: [alkali feldspar quartz trachyte, quartz trachyte,
      phonolite, foid-bearing alkali feldspar trachyte, basanite, trachyte,
      alkali feldspar trachyte, silexite, tephrite]
    # noise_floor is the binomial floor of the presence-frequency truth
    # estimator, in presence-fraction MAE units (eval.mode_head.binomial_floor,
    # stamped in every mode metrics.json); measured at this instrument's first
    # eval (joint_heads_regen_seed0, 2026-07-28). the tie band stays in nats --
    # adjudicated from the floor plus the seed-noise scale (~0.021 nats,
    # old-corpus figure), not converted; owner carried the 0.03 precedent
    noise_floor: 0.0206
    tie_band_nats: 0.03
versions:
  - version: standalone-modehead
    date: 2026-07-15
    checkpoint_tag: mode_head_seed0
    instrument: valtest128-broad
    changes: first supervised head -- standalone ModeHead on the frozen v3
      encoder (training pipeline since deleted; checkpoint on disk but
      unreadable by current code; runs/mode_head/mode_head_seed0/ is the
      preserved eval record)
    heads:
      mode: {joint_nll: -1.0066, bernoulli_nll: 5.0241, dirichlet_nll: -6.0307}
  - version: joint-baseline
    date: 2026-07-18
    checkpoint_tag: joint_heads_seed0_baseline
    instrument: valtest128-broad
    changes: three-head joint trainer (CompHead + support-conditioned
      CondHead added) at pre-sweep hyperparameters; mode statistically
      unchanged vs standalone (0.011 nats, inside the 0.03 tie band)
    heads:
      mode: {joint_nll: -0.9960, bernoulli_nll: 5.0255, dirichlet_nll: -6.0215}
      comp: {comp_nll: -50.9005}
      cond: {cond_nll: 8.4653, coverage_68: [0.661, 0.653, 0.650]}
  - version: joint-tuned
    date: 2026-07-21
    checkpoint_tag: joint_heads_seed0
    instrument: valtest128-broad
    changes: joint HPO adopted (lr 2.15e-4, wd 1.04e-5, magnitude_weight
      0.25, lambda_balance 54.5, dropout 0.348; mode 256x3, comp 128x1,
      cond 512x2); all three heads lifted
    heads:
      mode: {joint_nll: -1.1621, bernoulli_nll: 4.9425, dirichlet_nll: -6.1046}
      comp: {comp_nll: -53.8508}
      cond: {cond_nll: 8.3175, coverage_68: [0.715, 0.671, 0.684]}
  - version: support-conditioned-magnitude
    date: 2026-07-22
    checkpoint_tag: joint_heads_supportmag_seed0
    instrument: valtest128-broad
    changes: ModeHead magnitude branch conditioned on the assemblage support
      (same chain rule as CondHead, own trunk on latent + support); amp
      magnitude r 0.715 -> 0.876, PIT shifted-groups roughly halved across
      the common phases; small presence cost (+0.055 bernoulli nats)
    heads:
      mode: {joint_nll: -2.4565, bernoulli_nll: 4.9973, dirichlet_nll: -7.4538}
      comp: {comp_nll: -53.8954}
      cond: {cond_nll: 8.3114, coverage_68: [0.710, 0.674, 0.679]}
  - version: regen-baseline
    date: 2026-07-29
    checkpoint_tag: joint_heads_regen_seed0
    instrument: valtest128-traced@2000
    changes: heads retrained at the incumbent joint-tuned dials on the
      traced corpus -- first entry on the traced instrument, measuring the
      corpus change alone. NOT production; on the real-rock benchmark this
      version loses to support-conditioned-magnitude after identical
      recalibration (journal 2026-08-03), so production stays on the old
      broad-draw corpus.
    heads:
      mode: {joint_nll: -5.4187, bernoulli_nll: 3.5934, dirichlet_nll: -9.0122}
      comp: {comp_nll: -56.2998}
      cond: {cond_nll: 7.4035, coverage_68: [0.727, 0.683, 0.669]}
  - version: regen-tuned
    date: 2026-07-29
    checkpoint_tag: joint_heads_regen_tuned_seed0
    instrument: valtest128-traced@2000
    changes: weights-only mini-HPO winner (trial 22; magnitude_weight 0.25
      -> 7.76 = effective lambda 163, lr 3.4e-4, dropout 0.16,
      lambda_balance 0.012). Provisionally adopted 2026-07-29, adoption
      REVERSED 2026-08-03 -- worse than regen-baseline on every paired
      real-rock metric; the corrected selection criterion this motivated is
      recorded in docs/heads.md.
    heads:
      mode: {joint_nll: -5.4774, bernoulli_nll: 3.6291, dirichlet_nll: -9.1065}
      comp: {comp_nll: -56.2860}
      cond: {cond_nll: 7.3577, coverage_68: [0.699, 0.662, 0.655]}
  - version: allrock-baseline
    date: 2026-08-03
    checkpoint_tag: joint_heads_allrock_seed0
    instrument: valtest128-broad
    changes: heads retrained at the support-conditioned-magnitude production
      dials on the old broad-draw corpus with only the encoder swapped to
      the all-rock 23-token pretrain (pretrain_allrock_redox_seed0; redox
      slot padded throughout, so the swap measures the representation change
      alone). Teacher-forced mode improved ~0.16 nats over production on
      this instrument while sampled-support regressed ~0.28; on the
      real-rock benchmark zero-shot costs ~+1.0 nats and the recalibrated
      val contrast is a statistical tie (journal 2026-08-03). NOT
      production; both encoders proceed to corrected-criterion sweeps.
    heads:
      mode: {joint_nll: -2.6157, bernoulli_nll: 4.8850, dirichlet_nll: -7.5007}
      comp: {comp_nll: -53.9821}
      cond: {cond_nll: 8.2953, coverage_68: [0.711, 0.669, 0.672]}
  - version: allrock-tuned
    date: 2026-08-04
    checkpoint_tag: joint_heads_allrock_tuned_seed0
    instrument: valtest128-broad
    changes: first corrected-criterion sweep winner retrained at the
      production horizon (joint_heads_allrock_hpo trial 32 -- effective
      lambda 0.59, ModeHead 512x3, dropout 0.26; the sampled-support
      band-veto's first live exercise dropped 10 of 11 tied trials to pick
      it). Teacher-forced mode improves ~0.06 nats over allrock-baseline
      and sampled-support dirichlet recovers past production (-1.9620 vs
      -1.3074 baseline / -1.5884 supportmag, production at the time). After
      identical matrix recalibration the paired real-rock val contrast is a
      three-way statistical tie with this model's point estimate best
      (real_rock_ledger.yaml, journal 2026-08-04). PROMOTED TO PRODUCTION
      2026-08-05 on the encoder verdict -- the igneous twin sweep completed
      the tuned-vs-tuned contrast as a statistical tie leaning this model
      (journal 2026-08-05), and the all-rock encoder was adopted as
      canonical on its independent merits at no measured real-rock cost.
    heads:
      mode: {joint_nll: -2.6713, bernoulli_nll: 4.8598, dirichlet_nll: -7.5311}
      comp: {comp_nll: -53.4515}
      cond: {cond_nll: 8.2932, coverage_68: [0.698, 0.680, 0.655]}
  - version: igneous-tuned
    date: 2026-08-05
    checkpoint_tag: joint_heads_igneous_tuned_seed0
    instrument: valtest128-broad
    changes: igneous twin of the corrected-criterion sweep, completing the
      tuned-vs-tuned encoder contrast (joint_heads_igneous_hpo trial 43 --
      effective lambda 0.609, ModeHead 512x3, dropout 0.36; the
      sampled-support veto dropped 11 of 12 tied trials incl. the raw
      Optuna best, and production-dials trial 0 finished rank 23 of 48).
      Old igneous encoder on the old broad-draw corpus at matched
      budget/seed/criterion to allrock-tuned; the 120-epoch retrain
      replicated the sweep's mode best exactly (epoch 18). Trails
      allrock-tuned on both corpus axes (teacher-forced -2.5547 vs
      -2.6713, sampled-support -1.8200 vs -1.9620); after identical matrix
      recalibration the real-rock val contrast is a statistical tie
      leaning allrock-tuned (-0.209 [-0.460, +0.090] unit-clustered;
      real_rock_ledger.yaml, journal 2026-08-05). NOT production.
    heads:
      mode: {joint_nll: -2.5547, bernoulli_nll: 4.9386, dirichlet_nll: -7.4932}
      comp: {comp_nll: -54.0714}
      cond: {cond_nll: 8.3123, coverage_68: [0.715, 0.674, 0.672]}
